<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج التحقق من استيفاء متطلبات التحكيم — حاضنة ابتكار 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<!--
  مكتبة Supabase JS — عبر CDN. إذا كانت الشبكة عندك تحظر jsdelivr/unpkg،
  نزّل الملف وضمّنه محليًا بدل هذا السطر.
-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy-950:#12103C;
  --navy-800:#1A1852;
  --navy-700:#242066;
  --teal-600:#0E7C7B;
  --teal-500:#149493;
  --teal-100:#E4F3F2;
  --gold-500:#C9A24B;
  --gold-100:#F7EFDD;
  --purple-500:#6B4FA0;
  --green-500:#2FA36B;
  --paper:#F5F6F9;
  --card:#FFFFFF;
  --ink-900:#121826;
  --ink-600:#4C5568;
  --ink-400:#8790A3;
  --line:#E1E4EB;
  --danger:#C0392B;
  --danger-100:#FBEAE8;
  --success:#1E8E5A;
  --success-100:#E7F5EE;
  --amber:#B4790F;
  --amber-100:#FBF1DF;
  --radius:14px;
  --shadow:0 4px 20px rgba(11,11,61,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink-900);
  font-family:'IBM Plex Sans Arabic',sans-serif;
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;}
a{color:inherit;}

/* ===== corner-bracket signature element ===== */
.bracket-frame{position:relative;}
.bracket-frame::before,.bracket-frame::after,
.bracket-frame .bk-tl,.bracket-frame .bk-tr,.bracket-frame .bk-bl,.bracket-frame .bk-br{content:'';}
.bk-corner{position:absolute;width:16px;height:16px;border:2px solid var(--gold-500);opacity:.9;}
.bk-corner.tl{top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:6px 0 0 0;}
.bk-corner.tr{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:0 6px 0 0;}
.bk-corner.bl{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 0 6px;}
.bk-corner.br{bottom:-1px;left:-1px;border-right:none;border-top:none;border-radius:0 0 6px 0;}

/* ===== top bar ===== */
.topbar{
  background:linear-gradient(180deg,var(--navy-950) 0%,var(--navy-800) 100%);
  color:#fff;padding:18px 28px;position:sticky;top:0;z-index:40;
  box-shadow:0 6px 24px rgba(11,11,61,0.18);
}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;}
.brand-mark{
  position:relative;height:38px;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{height:100%;width:auto;}
.brand-text{flex:1;min-width:0;}
.brand-title{font-size:17px;font-weight:800;font-family:'Cairo',sans-serif;}
.brand-sub{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:2px;}
.project-pill{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:7px 14px;font-size:12.5px;color:rgba(255,255,255,.85);
  display:flex;align-items:center;gap:8px;flex:none;
}
.project-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal-500);box-shadow:0 0 0 3px rgba(20,148,147,.25);}
.topbar-actions{display:flex;gap:8px;flex:none;}
.btn-topbar{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;
  border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:background .15s;white-space:nowrap;font-family:inherit;
}
.btn-topbar:hover{background:rgba(255,255,255,.16);}
.btn-topbar:disabled{opacity:.55;cursor:not-allowed;}
.progress-shell{max-width:1180px;margin:12px auto 0;height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal-500),var(--gold-500));transition:width .35s ease;}
.progress-label{max-width:1180px;margin:6px auto 0;font-size:11.5px;color:rgba(255,255,255,.55);display:flex;justify-content:space-between;}

/* ===== شريط علوي مضغوط على الجوال — الجزء الثابت كان يأخذ مساحة كبيرة من الشاشة ===== */
@media(max-width:640px){
  .topbar{padding:10px 14px;}
  .topbar-inner{flex-wrap:wrap;gap:8px;row-gap:6px;}
  .brand-mark{height:24px;}
  .brand-title{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-sub{display:none;}
  .project-pill{padding:4px 10px;font-size:10.5px;order:3;}
  .topbar-actions{gap:6px;order:4;margin-inline-start:auto;}
  .btn-topbar{padding:5px 10px;font-size:10.5px;}
  .progress-shell{margin-top:8px;}
  .progress-label{font-size:9.5px;margin-top:4px;}
  .eq-divider{height:12px;}
}

/* ===== layout ===== */
.layout{max-width:1180px;margin:0 auto;padding:28px;display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start;}
@media(max-width:920px){.layout{grid-template-columns:1fr;padding:16px;}}

/* ===== stepper ===== */
.stepper{position:sticky;top:112px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
@media(max-width:920px){.stepper{position:static;overflow-x:auto;display:flex;padding:6px;}}
.step-item{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;border-right:3px solid transparent;transition:background .15s;}
.step-item:hover{background:var(--paper);}
.step-item.active{background:var(--teal-100);border-right-color:var(--teal-600);}
@media(max-width:920px){.step-item{border-right:none;border-bottom:3px solid transparent;flex:none;white-space:nowrap;}.step-item.active{border-bottom-color:var(--teal-600);}}
.step-num{
  width:26px;height:26px;border-radius:8px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
  background:var(--paper);color:var(--ink-400);border:1px solid var(--line);
}
.step-item.active .step-num{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
.step-item.done .step-num{background:var(--success-100);color:var(--success);border-color:var(--success);}
.step-item.warn .step-num{background:var(--amber-100);color:var(--amber);border-color:var(--amber);}
.step-title{font-size:13px;color:var(--ink-900);font-weight:500;}
.step-item.active .step-title{color:var(--navy-800);font-weight:600;}

/* ===== main panel ===== */
.panel{min-width:0;}
.section-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 30px;position:relative;}
@media(max-width:600px){.section-card{padding:20px 16px;}}
.section-head{padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--line);}
.section-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal-600);letter-spacing:.05em;font-weight:600;}
.section-title{font-size:21px;font-weight:800;color:var(--navy-800);margin-top:6px;font-family:'Cairo',sans-serif;}
.section-num-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:13px;margin-inline-end:8px;vertical-align:middle;}
.section-title::after{content:'';display:block;width:34px;height:3px;background:var(--teal-600);border-radius:2px;margin-top:8px;}
.section-desc{font-size:13.5px;color:var(--ink-600);margin-top:6px;}
.req-banner{background:var(--gold-100);border:1px solid #E9D6AB;border-radius:10px;padding:11px 14px;font-size:13px;color:#7A5C1E;margin-bottom:20px;display:flex;gap:8px;align-items:flex-start;}
.ann-banner{background:var(--teal-100);border:1px solid rgba(20,148,147,.28);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--teal-700,#0E5C5B);margin-bottom:12px;display:flex;gap:9px;align-items:flex-start;white-space:pre-wrap;line-height:1.7;}
.req-banner b{color:#5C4315;}

.field{margin-bottom:18px;}
.field-label{display:flex;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-900);margin-bottom:7px;}
.field-label .req-star{color:var(--danger);}
.field-hint{font-size:12px;color:var(--ink-400);margin-top:5px;}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=url],textarea,select{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink-900);font-family:inherit;font-size:14px;
  transition:border-color .15s, box-shadow .15s;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal-600);box-shadow:0 0 0 3px rgba(14,124,123,.13);}
textarea{min-height:96px;resize:vertical;}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%234C5568' stroke-width='1.6' fill='none'/></svg>");background-repeat:no-repeat;background-position:left 13px center;padding-left:34px;}
input:disabled,select:disabled{background:#F0F1F4;color:var(--ink-400);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.two-col{grid-template-columns:1fr;}}

.choice-row{display:flex;flex-wrap:wrap;gap:10px;}
.choice-pill{
  border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13.5px;cursor:pointer;
  display:flex;align-items:center;gap:8px;background:#fff;transition:all .15s;user-select:none;
}
.choice-pill:hover{border-color:var(--teal-500);}
.choice-pill.selected{border-color:var(--teal-600);background:var(--teal-100);color:var(--navy-800);font-weight:600;}
.choice-pill input{display:none;}
.choice-pill .ck{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--ink-400);flex:none;display:flex;align-items:center;justify-content:center;}
.choice-pill.selected .ck{background:var(--teal-600);border-color:var(--teal-600);}
.choice-pill.selected .ck::after{content:'✓';color:#fff;font-size:10px;line-height:1;}
.choice-pill.radio .ck{border-radius:50%;}
.choice-pill.radio.selected .ck::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;}

.stage-list{display:flex;flex-direction:column;gap:8px;}
.stage-opt{border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:all .15s;}
.stage-opt:hover{border-color:var(--teal-500);}
.stage-opt.selected{border-color:var(--teal-600);background:var(--teal-100);}
.stage-opt .ck{margin-top:3px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink-400);flex:none;display:flex;align-items:center;justify-content:center;}
.stage-opt.selected .ck{border-color:var(--teal-600);}
.stage-opt.selected .ck::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--teal-600);}
.stage-opt .stage-txt b{font-size:14px;color:var(--ink-900);font-family:'Cairo',sans-serif;font-weight:700;}
.stage-opt .stage-txt span{font-size:12.5px;color:var(--ink-600);display:block;margin-top:2px;}
.stage-opt .stage-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal-600);font-weight:600;}

.file-drop{
  border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;
  background:var(--paper);transition:border-color .15s, background .15s;
}
.file-drop:hover{border-color:var(--teal-500);background:var(--teal-100);}
.file-drop .fi-title{font-size:13px;font-weight:600;color:var(--navy-800);}
.file-drop .fi-sub{font-size:11.5px;color:var(--ink-400);margin-top:3px;}
.file-list{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.file-chip{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;}
.file-chip .fc-name{display:flex;align-items:center;gap:8px;color:var(--ink-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-chip .fc-size{color:var(--ink-400);font-family:'IBM Plex Mono',monospace;font-size:11px;flex:none;margin-inline-start:8px;}
.file-chip .fc-remove{color:var(--danger);cursor:pointer;font-size:12px;flex:none;margin-inline-start:10px;background:none;border:none;}
.video-toggle{display:flex;gap:8px;margin-bottom:10px;}
.vt-btn{border:1.5px solid var(--line);border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;background:#fff;}
.vt-btn.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}

.member-card{border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;position:relative;background:var(--paper);}
.member-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.member-tag{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--navy-800);color:#fff;border-radius:6px;padding:4px 10px;font-weight:600;}
.member-remove{background:none;border:none;color:var(--danger);font-size:12.5px;cursor:pointer;}
.add-member-btn{
  width:100%;border:1.5px dashed var(--teal-500);border-radius:12px;padding:13px;text-align:center;
  color:var(--teal-600);font-weight:600;font-size:13.5px;cursor:pointer;background:var(--teal-100);
}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:5px 12px;}
.badge.ok{background:var(--success-100);color:var(--success);}
.badge.no{background:var(--danger-100);color:var(--danger);}
.badge.mid{background:var(--amber-100);color:var(--amber);}
.checklist-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
@media(max-width:600px){.checklist-grid{grid-template-columns:1fr;}}
.checklist-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;}
.checklist-row .cr-label{font-size:13px;font-weight:600;color:var(--ink-900);}

.declaration-box{background:var(--navy-950);color:rgba(255,255,255,.88);border-radius:12px;padding:20px 22px 24px;font-size:13px;line-height:2;margin-bottom:20px;position:relative;overflow:hidden;}
.declaration-box::after{content:'';position:absolute;bottom:0;right:0;left:0;height:4px;background:var(--gold-500);}
.declaration-box b{color:var(--gold-500);}

.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap;}
.btn{border:none;border-radius:10px;padding:12px 22px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--navy-800);color:#fff;}
.btn-primary:hover{background:var(--navy-700);}
.btn-ghost{background:#fff;color:var(--ink-900);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-400);}
.btn-gold{background:var(--gold-500);color:var(--navy-950);}
.btn-gold:hover{filter:brightness(1.06);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.side-actions{display:flex;gap:10px;}

.toast{
  position:fixed;bottom:22px;right:50%;transform:translateX(50%);
  background:var(--navy-950);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translateX(50%) translateY(-4px);}
.toast .tdot{width:7px;height:7px;border-radius:50%;background:var(--teal-500);}

.error-text{color:var(--danger);font-size:12px;margin-top:5px;display:none;}
.field.has-error input,.field.has-error textarea,.field.has-error select{border-color:var(--danger);}
.field.has-error .error-text{display:block;}

.footer-note{max-width:1180px;margin:8px auto 40px;padding:0 28px;font-size:11.5px;color:var(--ink-400);text-align:center;}
.eq-divider{width:100%;height:22px;display:block;background:var(--paper);}@media print{
  body *{visibility:hidden;}
  #participantReportPrintable, #participantReportPrintable *{visibility:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #participantReportPrintable{position:absolute;top:0;right:0;left:0;width:100%;border:none!important;border-radius:0!important;margin:0!important;}
  @page{margin:14mm;}
}
</style>
</head>

/* ---------------- مقيّم الشروط الشرطية (يقرأ condition_expr القادم من القاعدة) ---------------- */
function evalCond(cond){
  if(!cond) return true;
  if(cond.all) return cond.all.every(c=>evalCond(c));
  const val = getVal(cond.field);
  switch(cond.op){
    case 'eq': return val === cond.value;
    case 'neq': return val !== cond.value;
    case 'in': return Array.isArray(cond.value) && cond.value.includes(val);
    case 'not_in': return Array.isArray(cond.value) && !cond.value.includes(val);
    case 'includes': return Array.isArray(val) && val.includes(cond.value);
    case 'not_empty': return val !== undefined && val !== null && String(val).trim() !== '';
    default: return true;
  }
}

  const f = { id: q.field_key, label: q.label, type: q.type, required: q.required };

  if(q.multiple) f.multiple = true;
  if(q.type === 'file') f.accept = '.pdf';
  if(q.hint) f.hint = q.hint;
  if(q.condition_expr) f.condition = ()=>evalCond(q.condition_expr);

  // استثناءات هيكلية معروفة — سلوك خاص مربوط بمعرّف الحقل نفسه، لا يُدار من
  // لوحة التحكم لأنه جزء من منطق النموذج الأساسي (مو نص/خيارات فقط):

  // متوفرة فعليًا؛ لو كانت فارغة (مثلًا جوال ناقص من الاستيراد) تبقى قابلة
  // للتعبئة كي لا يعلق المشارك بدون طريقة لإدخالها.
  if(['f1_3','f1_4','f1_5','f1_7','f1_8'].includes(q.field_key)) f.lockWhenFilled = true;
  if(q.field_key === 'f9_3'){                                    // خيارات أسماء الحضور تُشتق من أعضاء الفريق فعليًا
    f.optionsFn = ()=>state.members.map(m=>m.name).filter(Boolean);
    delete f.options;
  }
  return f;
}

/* ---------------- تحميل تعريف النموذج كاملًا من Supabase ---------------- */
async function loadFormDefinition(){
  const { data: secRows, error: secErr } = await SB.from('form_sections')
    .select('*').eq('is_active', true).order('order_index');
  if(secErr) throw secErr;
  const { data: qRows, error: qErr } = await SB.from('form_questions')
    .select('*').eq('is_active', true).order('order_index');
  if(qErr) throw qErr;

  SECTIONS = (secRows||[]).map(s=>{
    const obj = {
      id: s.id, key: s.section_key || null,
      title: s.title, desc: s.description || '',
      banner: s.banner || undefined,
      // f5_1 وf11_1 لهما عناصر واجهة خاصة مُهيكلة (منتقي المراحل، شارة الإقرار)
      // مرسومة يدويًا في renderStageSection/renderDeclareSection — نستبعدهما هنا
      // كي لا يُرسَما مرتين، مع بقائهما قابلين للتعديل نصيًا من لوحة التحكم.
      fields: (qRows||[])
        .filter(q=>q.section_id===s.id && !['f5_1','f11_1'].includes(q.field_key))
        .map(buildFieldFromDB),
    };
    if(s.section_key === 'team') obj.isTeamSection = true;
    if(s.section_key === 'proto') obj.isStageSection = true;
    if(s.section_key === 'checklist') obj.isChecklistSection = true;
    if(s.section_key === 'declare') obj.isDeclareSection = true;
    return obj;
  });

  if(SECTIONS.length === 0){
    throw new Error('لم يتم تحميل أي أقسام من قاعدة البيانات — تأكد من تنفيذ schema.sql وأن الأقسام نشطة.');
  }
}

function stageQualifies(){

/* ---------------- أدوات مساعدة ---------------- */
/* تنقية أي نص قبل إدراجه في innerHTML — للحماية من حقن HTML/JS، خصوصًا في
   محتوى الإعلانات (يعرضها كل مشارك يفتح الصفحة). */
function escHtml(str){
  if(str===null||str===undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* بصمة SHA-256 لمحتوى الملف — تُستخدم لاحقًا لرصد التكرار (نفس الملف
   بحقلين مختلفين، أو نفس الملف بطلبات مختلفة). لا نمنع الرفع أبدًا لو فشل
   حسابها لأي سبب — مجرد بيانات إضافية للفحص، مو شرط رفع. */
async function computeFileHash(file){
  try{
    const buf = await file.arrayBuffer();
    const hashBuf = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; }
}
function fmtSize(bytes){
  if(bytes<1024) return bytes+" B";
  if(bytes<1024*1024) return (bytes/1024).toFixed(0)+" KB";
  return (bytes/1024/1024).toFixed(1)+" MB";
}
function showToast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toastText').textContent=msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function visibleFields(section){
  return section.fields.filter(f=>!f.condition||f.condition(state));
}

/* ---------------- التقدم العام ---------------- */
function computeSectionCompletion(section){
  let total=0, done=0;
  if(section.isTeamSection){
    state.members.forEach(m=>{
      ["name","phone","email","role","spec","camp"].forEach(k=>{ total++; if(m[k]) done++; });
    });
  }
  visibleFields(section).forEach(f=>{
    if(!f.required) return;
    total++;
    const val = state.values[f.id];
    if(f.type==="file"){
      if((state.files[f.id]||[]).length>0) done++;
    } else if(f.type==="video"){
      const mode=state.videoMode[f.id]||"upload";
      if(mode==="upload"){ if((state.files[f.id]||[]).length>0) done++; }
      else { if(val) done++; }
    } else if(f.type==="multiselect"){
      if(val && val.length>0) done++;
    } else {
      if(val!==undefined && val!==null && String(val).trim()!=="") done++;
    }
  });
  if(section.isDeclareSection){ total++; if(state.values.f11_1) done++; }
  return {total,done};
}
function overallProgress(){
  let total=0,done=0;
  SECTIONS.forEach(s=>{ const c=computeSectionCompletion(s); total+=c.total; done+=c.done; });
  return total===0?0:Math.round(done/total*100);
}
function sectionStatus(section){
  const c=computeSectionCompletion(section);
  if(c.total===0) return "empty";
  if(c.done===0) return "empty";
  if(c.done===c.total) return "done";
  return "warn";
}

function renderField(f){

      body = `<input type="${f.type}" id="in_${f.id}" data-id="${f.id}" value="${val?String(val).replace(/"/g,'&quot;'):''}" ${locked?'disabled':''} ${f.id==='f9_2'?`max="${state.members.length}" min="0"`:''} placeholder="${locked?'':''}">`;
      if(f.id==='f9_2') f.hint = `الحد الأقصى ${state.members.length} (عدد أعضاء الفريق المسجَّلين)`;
      break;
    case "textarea":
      body = `<textarea id="in_${f.id}" data-id="${f.id}">${val?String(val):''}</textarea>`;
      break;
    case "select":
      body = `<select id="in_${f.id}" data-id="${f.id}" ${locked?'disabled':''}>
        <option value="" ${!val?'selected':''}>اختر…</option>
        ${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
      </select>`;
      break;
    case "radio":
      body = `<div class="choice-row" data-radio="${f.id}">${f.options.map(o=>`
        <label class="choice-pill radio ${val===o?'selected':''}" data-opt="${o}">
          <span class="ck"></span>${o}
        </label>`).join('')}</div>`;
      break;
    case "multiselect": {
      const opts = f.optionsFn ? f.optionsFn() : f.options;
      const arr = Array.isArray(val)?val:[];
      if(opts.length===0){
        body = `<div class="field-hint">لا توجد خيارات متاحة بعد — أكمل قسم فريق العمل أولًا.</div>`;
      } else {
        body = `<div class="choice-row" data-multi="${f.id}">${opts.map(o=>`
          <label class="choice-pill ${arr.includes(o)?'selected':''}" data-opt="${o}">
            <span class="ck"></span>${o}
          </label>`).join('')}</div>`;
      }

    }
    case "file": {
      const files = state.files[f.id]||[];
      body = IS_READONLY ? '' : `<div class="file-drop" data-filetrigger="${f.id}">
        <div class="fi-title">اضغط لإرفاق ${f.multiple?'ملف أو أكثر':'ملف'} (PDF)</div>
        <div class="fi-sub">الحد الأقصى ${MAX_PDF_MB} م.ب لكل ملف${f.multiple?` — حتى ${MAX_FILES_PER_FIELD} ملفات`:''}</div>
      </div>

      body += `<div class="file-list">${files.map((fl,i)=>`
        <div class="file-chip"><span class="fc-name">${icon('file-text',{size:13})} ${fl.name}</span><span class="fc-size">${fmtSize(fl.size)}</span>${IS_READONLY?'':`<button type="button" class="fc-remove" data-removefile="${f.id}" data-idx="${i}">إزالة</button>`}</div>
      `).join('')}</div>`;
      break;
    }
    case "video": {
      const mode = state.videoMode[f.id]||"upload";
      const files = state.files[f.id]||[];
      body = `<div class="video-toggle">
        <button type="button" class="vt-btn ${mode==='upload'?'active':''}" data-vmode="${f.id}" data-mode="upload">رفع فيديو</button>
        <button type="button" class="vt-btn ${mode==='link'?'active':''}" data-vmode="${f.id}" data-mode="link">رابط فيديو خاص</button>
      </div>`;
      if(mode==="upload"){
        body += IS_READONLY ? '' : `<div class="file-drop" data-filetrigger="${f.id}">
          <div class="fi-title">اضغط لرفع الفيديو</div>
          <div class="fi-sub">الحد الأقصى ${MAX_VIDEO_MB} م.ب ومدة ${MAX_VIDEO_MINUTES} دقائق</div>
        </div>
        <input type="file" id="file_${f.id}" data-fileinput="${f.id}" accept="video/*" style="display:none">`;
        body += `<div class="file-list">${files.map((fl,i)=>`
          <div class="file-chip"><span class="fc-name">${icon('video',{size:13})} ${fl.name}</span><span class="fc-size">${fmtSize(fl.size)}</span>${IS_READONLY?'':`<button type="button" class="fc-remove" data-removefile="${f.id}" data-idx="${i}">إزالة</button>`}</div>

      }

  return `<div class="field" id="fld_${f.id}">${labelHTML(f)}${body}${f.hint?`<div class="field-hint">${f.hint}</div>`:''}<div class="error-text">هذا الحقل مطلوب</div></div>`;

   لا داعي لإعادة إدخال اسم/هوية/جوال/بريد قائد الفريق بما إنها معروفة مسبقًا. */
function syncLeaderFromProjectInfo(){
  if(!state.members[0]) return;

  state.members[0].phone = getVal('f1_7') || '';
  state.members[0].email = getVal('f1_8') || '';

const SPECIALIZATIONS = ["الهندسة والتقنية","تطوير البرمجيات وتقنية المعلومات","إدارة الأعمال وريادة الأعمال","التسويق والمبيعات","التصميم وتجربة المستخدم","المالية والمحاسبة","العلوم الطبية والصحية","الذكاء الاصطناعي وعلوم البيانات","الهندسة الصناعية والتصنيع","القانون والشؤون التنظيمية","الموارد البشرية","العلوم البيئية والاستدامة","أخرى"];
function findDuplicateValues(list, key, normalize){
  const counts = {};
  list.forEach(m=>{
    const raw = (m[key]||'').trim();
    if(!raw) return;
    const v = normalize ? normalize(raw) : raw;
    counts[v] = (counts[v]||0)+1;
  });
  return new Set(Object.keys(counts).filter(v=>counts[v]>1));
}

function deriveChecklist(){
  const cr1=getVal("f2_1");
  const crStatus = cr1==="نعم" ? "ok" : (cr1==="لا"?"no":"pending");
  const campStatus = getVal("f3_2")==="نعم"?"ok":(getVal("f3_2")==="لا"?"mid":"pending");
  const membersFilled = state.members.filter(m=>m.name).length;
  const teamStatus = membersFilled>=2 ? "ok":"no";
  const stageSet = !!getVal("f5_1");
  const protoStatus = stageSet ? (stageQualifies()?"ok":"no") : "pending";
  const pitchVal = getVal("f6_1");
  let pitchStatus="pending";
  if(pitchVal==="مكتمل وفق النموذج المعتمد") pitchStatus="ok";
  else if(["مكتمل مع تعديلات محدودة","مكتمل بصيغة مختلفة"].includes(pitchVal)) pitchStatus="mid";
  else if(["غير مكتمل","لم يبدأ"].includes(pitchVal)) pitchStatus="no";
  const mktVal = getVal("f7_1");
  let mktStatus="pending";
  if(mktVal==="تحقق مكتمل") mktStatus="ok";
  else if(mktVal==="تحقق جزئي") mktStatus="mid";
  else if(["تحقق جارٍ","لم يبدأ التحقق"].includes(mktVal)) mktStatus="no";
  return [
    {label:"السجل التجاري",status:crStatus},
    {label:"حضور المعسكر",status:campStatus},
    {label:"عدد أعضاء الفريق",status:teamStatus},
    {label:"النموذج الأولي",status:protoStatus},
    {label:"العرض الاستثماري",status:pitchStatus},
    {label:"التحقق من احتياج السوق",status:mktStatus},
  ];
}
function badgeHTML(status){
  const map={ok:["مستوفى","ok"],no:["غير مستوفى","no"],mid:["يحتاج تحقق","mid"],pending:["لم يُستكمل بعد","mid"]};
  const [txt,cls]=map[status];
  return `<span class="badge ${cls}">${txt}</span>`;
}

    (٥) خضوع هذا الطلب لإجراءات المراجعة والتحقق من قِبل فريق البرنامج.<br>
    (٦) التزامي بإبلاغ إدارة البرنامج فورًا بأي تغييرات جوهرية تطرأ على البيانات الواردة أعلاه.<br>
    (٧) السماح لإدارة البرنامج باستخدام البيانات والمرفقات المقدَّمة لأغراض مراجعة وتقييم المشاركة في البرنامج.
  </div>`;
  html += `<label class="choice-pill ${state.values.f11_1?'selected':''}" id="declareCheck" style="width:100%;justify-content:flex-start;margin-bottom:20px"><span class="ck"></span>أوافق على الإقرار أعلاه وأتعهد بصحة ما ورد فيه<span class="req-star">*</span></label>`;
  html += visibleFields(section).map(renderField).join('');
  return html;
}

/* ---------------- عرض القسم الحالي ---------------- */
const ACCENT_CYCLE = ['#0E7C7B','#6B4FA0','#C9A24B','#2FA36B'];
function renderSection(){
  const sectionIndex = SECTIONS.findIndex(s=>s.id===state.current);
  const section = SECTIONS[sectionIndex] || SECTIONS[0];
  const isFirst = sectionIndex <= 0;
  const isLast = sectionIndex === SECTIONS.length - 1;
  const card = document.getElementById('sectionCard');
  const accent = ACCENT_CYCLE[sectionIndex % ACCENT_CYCLE.length];
  let inner = '';
  if(FORM_STATUS === 'submitted'){
    inner += `<div style="padding:16px 20px 0"><button class="btn btn-ghost btn-sm" id="btnBackToResult">${icon('arrow-right',{size:13})} رجوع لنتيجة الاستيفاء</button></div>`;
  }
  inner += `<div class="section-head">
    <div class="section-eyebrow">القسم ${sectionIndex+1} / ${SECTIONS.length}</div>
    <div class="section-title"><span class="section-num-badge" style="background:${accent}">${sectionIndex+1}</span>${section.title}</div>
    <div class="section-desc">${section.desc}</div>
  </div>`;
  if(section.banner) inner += `<div class="req-banner"><b>تنبيه:</b>&nbsp;${section.banner}</div>`;
  if(IS_READONLY) inner += `<div class="req-banner" style="background:var(--danger-100);color:var(--danger)"><b>🔒 هذا النموذج مقفل للتعديل حاليًا من قبل فريق البرنامج.</b>&nbsp;تقدر تتصفح بياناتك، لكن أي تعديل لن يُحفظ.</div>`;

  if(section.isTeamSection) inner += renderTeamSection(section);
  else if(section.isStageSection) inner += renderStageSection(section);
  else if(section.isChecklistSection) inner += renderChecklistSection(section);
  else if(section.isDeclareSection) inner += renderDeclareSection(section);
  else inner += visibleFields(section).map(renderField).join('');

  inner += `<div class="nav-row">
    <button class="btn btn-ghost" id="btnPrev" ${isFirst?'disabled':''}>القسم السابق</button>
    <div class="side-actions">
      ${IS_READONLY ? '' : `<button class="btn btn-ghost" id="btnSaveDraft">حفظ كمسودة</button>
      ${isLast
        ? `<button class="btn btn-gold" id="btnSubmit">إرسال النموذج</button>`
        : `<button class="btn btn-primary" id="btnNext">القسم التالي</button>`}`}
      ${IS_READONLY && !isLast ? `<button class="btn btn-primary" id="btnNext">القسم التالي</button>` : ''}
    </div>
  </div>`;
  card.innerHTML = inner;
  bindSectionEvents(section);
}
/* ---------------- ربط الأحداث ---------------- */
function bindSectionEvents(section){
  document.querySelectorAll('[data-id]').forEach(el=>{
    el.addEventListener('input',e=>{ setVal(el.dataset.id, el.value); refreshLight(); });
    el.addEventListener('change',e=>{ setVal(el.dataset.id, el.value); renderAll(); });
  });
  document.querySelectorAll('[data-radio]').forEach(group=>{
    group.querySelectorAll('.choice-pill').forEach(p=>{
      p.addEventListener('click',()=>{ setVal(group.dataset.radio, p.dataset.opt); renderAll(); });
    });
  });
  document.querySelectorAll('[data-multi]').forEach(group=>{
    group.querySelectorAll('.choice-pill').forEach(p=>{
      p.addEventListener('click',()=>{
        const id=group.dataset.multi;
        const arr = Array.isArray(state.values[id])?state.values[id].slice():[];
        const opt=p.dataset.opt;
        const idx=arr.indexOf(opt);
        if(idx>-1) arr.splice(idx,1); else arr.push(opt);
        state.values[id]=arr;
        renderAll();
      });
    });
  });
  document.querySelectorAll('[data-filetrigger]').forEach(drop=>{
    drop.addEventListener('click',()=>{ document.getElementById('file_'+drop.dataset.filetrigger).click(); });
  });
  document.querySelectorAll('[data-fileinput]').forEach(inp=>{
    inp.addEventListener('change', async e=>{
      if(IS_READONLY){ showToast('🔒 هذا النموذج مقفل للتعديل حاليًا — تعذّر رفع أي ملف.'); inp.value=''; return; }
      const id=inp.dataset.fileinput;
      const list = state.files[id]||[];
      const fdef = findFieldDef(id);
      const maxSize = fdef && fdef.type==='video' ? MAX_VIDEO_MB*1024*1024 : MAX_PDF_MB*1024*1024;
      const filesToUpload = [];
      Array.from(inp.files).forEach(file=>{
        if(fdef && fdef.type!=='video' && !file.name.toLowerCase().endsWith('.pdf')){
          showToast('تعذّر رفع الملف — يُقبل PDF فقط'); return;
        }
        if(file.size>maxSize){ showToast(`تجاوز الحجم المسموح به (الحد الأقصى ${fdef && fdef.type==='video' ? MAX_VIDEO_MB : MAX_PDF_MB} م.ب)`); return; }
        if(list.length>=MAX_FILES_PER_FIELD && fdef.multiple){ showToast(`الحد الأقصى ${MAX_FILES_PER_FIELD} ملفات لهذا الحقل`); return; }
        filesToUpload.push(file);
      });
      if(filesToUpload.length===0) return;

      showToast('جارٍ رفع الملف…');
      for(const file of filesToUpload){
        try{
          // Supabase Storage لا يقبل مفاتيح تحتوي أحرفًا عربية أو رموزًا خاصة —
          // نستخدم اسمًا آمنًا (ASCII فقط) لمسار التخزين الفعلي، ونحتفظ بالاسم
          // العربي الأصلي في عمود file_name للعرض فقط.
          const ext = (file.name.split('.').pop() || 'dat').replace(/[^a-zA-Z0-9]/g,'').toLowerCase() || 'dat';
          const safeName = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
          const storagePath = `${PROJECT_ID}/${id}/${safeName}`;
          const fileHash = await computeFileHash(file);
          const { error: upErr } = await SB_AUTH.storage.from('form-attachments').upload(storagePath, file, { upsert: false });
          if(upErr) throw upErr;

          // إذا كان الحقل يستبدل ملفًا سابقًا (غير متعدد)، احذف القديم من التخزين وقاعدة البيانات أولًا
          if(!fdef.multiple && list.length>=1){
            const old = list.pop();
            if(old.storage_path) await SB_AUTH.storage.from('form-attachments').remove([old.storage_path]);
            if(old.id) await SB_AUTH.from('form_files').delete().eq('id', old.id);
          }

          const { data: fileRow, error: insErr } = await SB_AUTH.from('form_files').insert({
            form_id: FORM_ID, field_key: id, storage_path: storagePath,
            file_name: file.name, mime_type: file.type, size_bytes: file.size, file_hash: fileHash,
          }).select().single();
          if(insErr) throw insErr;

          list.push({ name: file.name, size: file.size, id: fileRow.id, storage_path: storagePath });
        } catch(err){
          showToast('تعذّر رفع "' + file.name + '": ' + (err.message || 'خطأ غير معروف'));
        }
      }
      state.files[id]=list;
      renderAll();
    });
  });
  document.querySelectorAll('[data-removefile]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(IS_READONLY){ showToast('🔒 هذا النموذج مقفل للتعديل حاليًا — تعذّر حذف أي ملف مرفق.'); return; }
      const id=btn.dataset.removefile, idx=parseInt(btn.dataset.idx);
      const fileEntry = state.files[id][idx];
      state.files[id].splice(idx,1);
      renderAll();
      try{
        if(fileEntry.storage_path) await SB_AUTH.storage.from('form-attachments').remove([fileEntry.storage_path]);
        if(fileEntry.id) await SB_AUTH.from('form_files').delete().eq('id', fileEntry.id);
      } catch(err){
        showToast('تعذّر حذف الملف من الخادم — قد يظهر مجددًا عند إعادة التحميل');
      }
    });
  });
  document.querySelectorAll('[data-vmode]').forEach(btn=>{
    btn.addEventListener('click',()=>{ state.videoMode[btn.dataset.vmode]=btn.dataset.mode; renderAll(); });
  });
  document.querySelectorAll('[data-member]').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evt,()=>{
      state.members[parseInt(el.dataset.member)][el.dataset.mkey]=el.value;
      if(el.tagName==='SELECT') renderAll(); else refreshLight();
    });
  });
  const addBtn = document.getElementById('addMemberBtn');
  if(addBtn) addBtn.addEventListener('click',()=>{
    state.members.push({name:"",phone:"",email:"",role:"",spec:"",specOther:"",camp:"",title:""});
    renderAll();
  });
  document.querySelectorAll('[data-removemember]').forEach(btn=>{
    btn.addEventListener('click',()=>{ state.members.splice(parseInt(btn.dataset.removemember),1); renderAll(); });
  });
  document.querySelectorAll('[data-stage]').forEach(opt=>{
    opt.addEventListener('click',()=>{ setVal('f5_1', opt.dataset.stage); renderAll(); });
  });
  const dc = document.getElementById('declareCheck');
  if(dc) dc.addEventListener('click',()=>{ state.values.f11_1 = !state.values.f11_1; renderAll(); });

  const prev=document.getElementById('btnPrev');
  if(prev) prev.addEventListener('click',()=>{
    const idx = SECTIONS.findIndex(s=>s.id===state.current);
    if(idx>0){ state.current = SECTIONS[idx-1].id; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
  });
  const next=document.getElementById('btnNext');
  if(next) next.addEventListener('click',()=>{
    if(IS_READONLY || validateSection(section)){
      const idx = SECTIONS.findIndex(s=>s.id===state.current);
      if(idx < SECTIONS.length-1){ state.current = SECTIONS[idx+1].id; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
    }
  });
  const save=document.getElementById('btnSaveDraft');
  if(save) save.addEventListener('click',()=>{ saveDraft(); });
  const submit=document.getElementById('btnSubmit');
  if(submit) submit.addEventListener('click',()=>{ trySubmit(); });
  const backToResultBtn=document.getElementById('btnBackToResult');
  if(backToResultBtn) backToResultBtn.addEventListener('click',()=>{
    showingThankYou = true;
    renderAll();
    window.scrollTo({top:0,behavior:'smooth'});
  });
}
function findFieldDef(id){
  for(const s of SECTIONS){ const f=s.fields.find(x=>x.id===id); if(f) return f; }
  return null;
}

/* ---------------- التحقق ---------------- */
function validateSection(section, silent=false){
  let ok=true;
  let customMsg = null;
  visibleFields(section).forEach(f=>{
    if(!f.required) return;
    const wrap = silent ? null : document.getElementById('fld_'+f.id);
    let filled=true;
    if(f.type==='file') filled=(state.files[f.id]||[]).length>0;
    else if(f.type==='video'){
      const mode=state.videoMode[f.id]||'upload';
      filled = mode==='upload' ? (state.files[f.id]||[]).length>0 : !!getVal(f.id);
    }
    else if(f.type==='multiselect') filled = (getVal(f.id)||[]).length>0;
    else filled = getVal(f.id) && String(getVal(f.id)).trim()!=="";
    if(!filled){ ok=false; if(wrap) wrap.classList.add('has-error'); }
    else if(wrap) wrap.classList.remove('has-error');

    // حد أقصى لعدد الحضور المتوقع = عدد أعضاء الفريق فعليًا
    if(f.id==='f9_2'){
      const val = parseInt(getVal('f9_2'))||0;
      if(val > state.members.length){
        ok=false; customMsg = `عدد الحضور المتوقع (${val}) لا يمكن أن يتجاوز عدد أعضاء الفريق (${state.members.length}).`;
      }
    }
  });
  if(section.isTeamSection){
    if(state.members.length<2) ok=false;
    state.members.forEach(m=>{
      if(!m.name||!m.phone||!m.email||!m.role||!m.spec||!m.camp) ok=false;
      if(m.spec==='أخرى' && !(m.specOther||'').trim()) ok=false;
    });
    const dupPhones = findDuplicateValues(state.members, 'phone', v=>v.replace(/\s+/g,''));
    const dupEmails = findDuplicateValues(state.members, 'email', v=>v.toLowerCase());
    if(dupPhones.size){ ok=false; customMsg = 'لا يمكن تكرار رقم الجوال بين أعضاء الفريق — كل عضو يجب أن يكون له رقم مختلف.'; }
    if(dupEmails.size){ ok=false; customMsg = 'لا يمكن تكرار البريد الإلكتروني بين أعضاء الفريق — كل عضو يجب أن يكون له بريد مختلف.'; }
  }
  if(section.isDeclareSection && !state.values.f11_1) ok=false;
  if(!ok && !silent) showToast(customMsg || 'يرجى استكمال الحقول الإلزامية المظللة قبل المتابعة');
  return ok;
}

/* تفحص كل الأقسام (مو بس القسم الحالي) وترجع أول قسم فيه حقول إلزامية ناقصة —
   ضرورية قبل الإرسال، لأن المشارك يقدر يقفز مباشرة لقسم الإقرار عبر الشريط
   الجانبي متجاوزًا أزرار "التالي" اللي تتحقق من القسم الحالي فقط. */
function findFirstInvalidSection(){
  for(const sec of SECTIONS){
    if(!validateSection(sec, true)) return sec;
  }
  return null;
}

/* ---------------- الحفظ والإرسال ---------------- */
/* تحقق فوري ومباشر من قاعدة البيانات (لا يعتمد على الحالة المحمَّلة سابقًا في
   المتصفح) — يُستدعى قبل كل عملية حفظ أو إرسال، حتى لو كانت الصفحة مفتوحة من
   قبل إغلاق النموذج ولم تُحدَّث بعد. */
async function refuseIfClosed(){
  try{
    const { data } = await SB.from('form_settings').select('is_open, deadline_at').eq('id',1).maybeSingle();
    if(data){
      FORM_IS_OPEN = data.is_open !== false;
      FORM_DEADLINE = data.deadline_at ? new Date(data.deadline_at) : null;
    }
  }catch(e){ /* لو فشل الاتصال، نعتمد على آخر حالة معروفة بدل ما نمنع الحفظ بالخطأ */ }
  if(computeClosedState()){
    showToast(FORM_CLOSED_REASON==='deadline' ? 'انتهى الموعد النهائي — تعذّر الحفظ.' : 'تم إغلاق النموذج من قبل فريق البرنامج — تعذّر الحفظ.');
    setTimeout(()=>window.location.reload(), 1800);
    return true;
  }
  return false;
}

async function saveDraft(showToastOnSuccess = true){
  if(!FORM_ID){ showToast('تعذّر الحفظ: لم يتم تحميل النموذج بعد'); return false; }
  if(await refuseIfClosed()) return false;
  if(IS_READONLY){
    clearTimeout(autosaveTimer); // نوقف أي محاولة حفظ تلقائي معلّقة — يمنع حلقة تكرار الرسالة
    if(showToastOnSuccess) showToast('تم قفل التعديل على هذا النموذج من قبل فريق البرنامج — تعذّر الحفظ.');
    const statusEl = document.getElementById('draftStatus');
    if(statusEl) statusEl.textContent = 'مقفل للتعديل';
    return false;
  }
  syncLeaderFromProjectInfo();
  document.getElementById('draftStatus').textContent = 'جارٍ الحفظ…';
  try{
    // 1) تحديث نسبة الاكتمال وطابع التحديث على verification_forms
    const { error: vfErr } = await SB_AUTH
      .from('verification_forms')
      .update({ completion_pct: overallProgress() })
      .eq('id', FORM_ID);
    if(vfErr) throw vfErr;

    // 2) مزامنة كل الإجابات دفعة واحدة (upsert على form_id + field_key)
    const answerRows = Object.keys(state.values)
      .filter(k => state.values[k] !== undefined && state.values[k] !== null && state.values[k] !== "")
      .map(k => {
        const v = state.values[k];
        const isArray = Array.isArray(v);
        return {
          form_id: FORM_ID,
          field_key: k,
          value_text: isArray ? null : String(v),
          value_json: isArray ? v : null,
        };
      });
    if(answerRows.length){
      const { error: ansErr } = await SB_AUTH.from('form_answers').upsert(answerRows, { onConflict: 'form_id,field_key' });
      if(ansErr) throw ansErr;
    }

    // 3) مزامنة أعضاء الفريق (حذف كامل ثم إعادة إدراج — أبسط استراتيجية مزامنة لعدد صغير من الصفوف)
    const membersToSave = state.members.filter(m => m.name && m.name.trim());
    const { error: delErr } = await SB_AUTH.from('team_members').delete().eq('form_id', FORM_ID);
    if(delErr) throw delErr;
    if(membersToSave.length){
      const memberRows = membersToSave.map((m,i) => ({
        form_id: FORM_ID, full_name: m.name, phone: m.phone, email: m.email,
        role_in_project: m.role, specialization: (m.spec==='أخرى' ? (m.specOther||'').trim() || 'أخرى' : m.spec),
        attended_camp: m.camp === "نعم" ? true : (m.camp === "لا" ? false : null),
        title_in_entity: m.title || null, is_leader: i === 0, order_index: i,
      }));
      const { error: memErr } = await SB_AUTH.from('team_members').insert(memberRows);
      if(memErr) throw memErr;
    }

    document.getElementById('draftStatus').textContent = 'تم حفظ المسودة — ' + new Date().toLocaleTimeString('ar-SA');
    if(showToastOnSuccess) showToast('تم حفظ المسودة بنجاح');
    return true;
  } catch(e){
    document.getElementById('draftStatus').textContent = 'تعذّر الحفظ — سيُعاد المحاولة عند تعديلك التالي';
    showToast('حدث خطأ أثناء الحفظ: ' + (e.message || 'خطأ غير معروف'));
    return false;
  }
}

async function trySubmit(){
  if(await refuseIfClosed()) return;
  if(IS_READONLY){
    showToast('تم قفل التعديل على هذا النموذج من قبل فريق البرنامج — تعذّر الإرسال.');
    return;
  }

  const invalidSection = findFirstInvalidSection();
  if(invalidSection){
    state.current = invalidSection.id;
    renderAll();
    window.scrollTo({top:0,behavior:'smooth'});
    validateSection(invalidSection); // إعادة تشغيل التحقق (غير صامت) الآن لتظليل الحقول الناقصة بصريًا
    showToast(`يوجد حقول إلزامية غير مكتملة في قسم "${invalidSection.title}" — أكملها قبل الإرسال.`);
    return;
  }

  const saved = await saveDraft(false);
  if(!saved){ return; }

  try{
    const { error } = await SB_AUTH
      .from('verification_forms')
      .update({ status: 'submitted', submitted_at: new Date().toISOString() })
      .eq('id', FORM_ID);
    if(error) throw error;
    showToast('تم إرسال النموذج بنجاح — سيقوم فريق البرنامج بالمراجعة');
    showingThankYou = true;
    renderAll();
    window.scrollTo({top:0,behavior:'smooth'});
  } catch(e){
    showToast('تعذّر إرسال النموذج: ' + (e.message || 'خطأ غير معروف'));
  }
}

/* ---------------- تحديثات خفيفة بدون إعادة رسم كاملة ---------------- */
let autosaveTimer = null;
function scheduleAutosave(){
  if(!FORM_ID || IS_READONLY) return;
  clearTimeout(autosaveTimer);
  document.getElementById('draftStatus').textContent = 'تعديلات غير محفوظة…';
  autosaveTimer = setTimeout(()=>{ saveDraft(false); }, 2500);
}
function refreshLight(){
  updateTopbar();
  renderStepper();
  scheduleAutosave();
}
function updateTopbar(){
  const pct = (SUBMITTED_COMPLETION_PCT !== null) ? SUBMITTED_COMPLETION_PCT : overallProgress();
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressText').textContent = pct+'% مكتمل';
  document.getElementById('pillProjectId').textContent = getVal('f1_1') || '—';
  document.getElementById('subProjectName').textContent = getVal('f1_2') ? ('مشروع: '+getVal('f1_2')) : 'مسار المشاركة والمجال يُحددان تلقائيًا من بيانات المنصة';
}

function renderThankYouScreen(){
  const card = document.getElementById('sectionCard');
  const closed = computeClosedState();
  const canEdit = ALLOW_EDIT_AFTER_SUBMIT && !closed && !IS_READONLY;

  const genericMessage = `<div style="font-size:14px;color:var(--ink-600);max-width:480px;margin:0 auto 26px;line-height:1.9">
    شكرًا لإكمال نموذج التحقق من استيفاء متطلبات الانتقال إلى مرحلة التحكيم. سيقوم فريق البرنامج بمراجعة طلبكم، وسيتم التواصل معكم في حال الحاجة لأي استكمال.
  </div>`;

  const qualifiedDetails = `<div style="max-width:480px;margin:0 auto 22px;padding:20px 22px;border-radius:12px;background:var(--paper);border:1px solid var(--line);text-align:right">
    <div style="font-size:13.5px;color:var(--ink-900);line-height:2">عزيزي المشارك في حاضنة ابتكار 5،</div>

/* ---------------- عد تنازلي حي حتى الموعد النهائي ---------------- */
function fmtCountdown(ms){
  if(ms<=0) return null;
  const totalMin = Math.floor(ms/60000);
  const days = Math.floor(totalMin/1440);
  const hours = Math.floor((totalMin%1440)/60);
  const mins = totalMin%60;
  if(days>0) return `${days} يوم ${hours} ساعة`;
  if(hours>0) return `${hours} ساعة ${mins} د`;
  return `${mins} دقيقة`;
}
function startCountdown(){
  const el = document.getElementById('deadlineCountdown');
  if(!el || !FORM_DEADLINE) return;
  el.style.display = 'flex';
  el.style.alignItems = 'center';
  el.style.gap = '5px';
  clearInterval(countdownTimer);
  const tick = ()=>{
    const remaining = FORM_DEADLINE - new Date();
    const label = fmtCountdown(remaining);
    if(!label){
      clearInterval(countdownTimer);
      window.location.reload(); // الموعد وصل فعليًا — أعد التحميل ليطبَّق القفل فورًا
      return;
    }
    el.innerHTML = `${icon('hourglass',{size:11})} يُغلق خلال ${label}`;
  };
  tick();
  countdownTimer = setInterval(tick, 30000);
}
/* فحص دوري: لو الإداري أغلق النموذج يدويًا أثناء وجود المشارك بالصفحة */
function startCloseWatcher(){
  clearInterval(closeWatchTimer);
  closeWatchTimer = setInterval(async ()=>{
    try{
      const { data } = await SB.from('form_settings').select('is_open').eq('id',1).maybeSingle();
      if(data && data.is_open === false && FORM_STATUS !== 'submitted'){
        window.location.reload();
      }
    }catch(e){}
  }, 120000); // كل دقيقتين
}

function renderAnnouncementsBanner(){
  const el = document.getElementById('announcementsBanner');
  if(!el) return;
  const reportBanner = PUBLISHED_REPORT ? `<div class="ann-banner" id="reportBannerLink" style="cursor:pointer;background:var(--navy-800);color:#fff">${icon('file-text',{size:14})}<span>تقرير مشروعكم جاهز للاطلاع عليه</span></div>` : '';
  const regularBanners = ACTIVE_ANNOUNCEMENTS.map(a=>`<div class="ann-banner">${icon('megaphone',{size:14})}<span>${escHtml(a.message)}</span></div>`).join('');
  el.innerHTML = reportBanner + regularBanners;
  const bannerLink = document.getElementById('reportBannerLink');
  if(bannerLink) bannerLink.addEventListener('click', ()=>{ showingReport = true; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); });
}

function renderAll(){
  renderStepper();
  renderAnnouncementsBanner();
  if(showingReport){ renderReportScreen(); updateTopbar(); return; }
  if(showingThankYou){ renderThankYouScreen(); updateTopbar(); return; }
  renderSection();
  updateTopbar();
  scheduleAutosave();
}

/* ---------------- تحميل النموذج من Supabase عند بدء التشغيل ---------------- */
async function initApp(){
  const session = requireSessionOrRedirect();
  if(!session) return; // requireSessionOrRedirect يحوّل المستخدم لصفحة الدخول

  PROJECT_ID = session.project_id;
  SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  SB_AUTH = SB; // عميل واحد يكفي الآن — الوصول محكوم بـ RLS على "مشروع نشط" فقط

  try{
    // 0) تعريف النموذج نفسه (الأقسام والأسئلة) — لازم يُحمَّل قبل أي شيء آخر
    await loadFormDefinition();

    // 1) بيانات المشروع الأساسية
    const { data: proj } = await SB.from('eligible_projects')
      .select('project_id, project_name, team_leader_name, team_leader_phone, team_leader_email, track, domain, is_active, edit_locked')
      .eq('project_id', PROJECT_ID).maybeSingle();
    IS_READONLY = !!proj && (proj.is_active === false || proj.edit_locked === true);
    PROJECT_NAME = proj ? (proj.project_name || '') : '';

    // 2) جلب سجل النموذج أو إنشاؤه لأول مرة
    let { data: form, error: formErr } = await SB_AUTH.from('verification_forms')
      .select('id, status, completion_pct').eq('project_id', PROJECT_ID).maybeSingle();
    if(formErr) throw formErr;
    if(!form){
      const { data: created, error: createErr } = await SB_AUTH.from('verification_forms')
        .insert({ project_id: PROJECT_ID, status: 'draft' }).select().single();
      if(createErr) throw createErr;
      form = created;
    }
    FORM_ID = form.id;
    if(form.status === 'submitted') SUBMITTED_COMPLETION_PCT = form.completion_pct;

    // 3) الإجابات المحفوظة سابقًا
    const { data: answers } = await SB_AUTH.from('form_answers').select('field_key, value_text, value_json').eq('form_id', FORM_ID);
    (answers||[]).forEach(a=>{ state.values[a.field_key] = a.value_json !== null ? a.value_json : a.value_text; });

    // 4) أعضاء الفريق
    const { data: members } = await SB_AUTH.from('team_members').select('*').eq('form_id', FORM_ID).order('order_index');
    if(members && members.length){
      state.members = members.map(m=>({
        name:m.full_name||"", phone:m.phone||"", email:m.email||"",
        role:m.role_in_project||"",
        spec: SPECIALIZATIONS.includes(m.specialization) ? m.specialization : (m.specialization ? "أخرى" : ""),
        specOther: SPECIALIZATIONS.includes(m.specialization) ? "" : (m.specialization||""),
        camp: m.attended_camp===true?"نعم":(m.attended_camp===false?"لا":""),
        title: m.title_in_entity||"",
      }));
    }

    // 5) الملفات المرفوعة سابقًا (غير المحذوفة)
    const { data: files } = await SB_AUTH.from('form_files').select('*').eq('form_id', FORM_ID).is('deleted_at', null);
    (files||[]).forEach(f=>{
      if(!state.files[f.field_key]) state.files[f.field_key] = [];
      state.files[f.field_key].push({ name:f.file_name, size:f.size_bytes, id:f.id, storage_path:f.storage_path });
    });

    // 6) تعبئة بيانات المشروع الأساسية — eligible_projects هو المصدر الرسمي
    // لهذه الحقول (لذلك تُقفَل في الواجهة)، فتُعتمد قيمته دائمًا عند توفرها.
    setVal('f1_1', PROJECT_ID);
    if(proj){
      if(proj.team_leader_name) setVal('f1_5', proj.team_leader_name);
      if(proj.track) setVal('f1_3', proj.track);
      if(proj.domain) setVal('f1_4', proj.domain);
      if(proj.team_leader_phone) setVal('f1_7', proj.team_leader_phone);
      if(proj.team_leader_email) setVal('f1_8', proj.team_leader_email);
    }

    // 7) إعدادات النموذج — هل يُسمح بالتعديل بعد الإرسال؟ وهل النموذج مفتوح؟ وحدود الملفات؟
    const { data: settings } = await SB.from('form_settings')
      .select('allow_edit_after_submit, is_open, deadline_at, max_pdf_mb, max_video_mb, max_video_minutes, max_files_per_field')
      .eq('id',1).maybeSingle();
    if(settings){
      if(settings.allow_edit_after_submit === false) ALLOW_EDIT_AFTER_SUBMIT = false;
      FORM_IS_OPEN = settings.is_open !== false;
      FORM_DEADLINE = settings.deadline_at ? new Date(settings.deadline_at) : null;
      if(settings.max_pdf_mb) MAX_PDF_MB = settings.max_pdf_mb;
      if(settings.max_video_mb) MAX_VIDEO_MB = settings.max_video_mb;
      if(settings.max_video_minutes) MAX_VIDEO_MINUTES = settings.max_video_minutes;
      if(settings.max_files_per_field) MAX_FILES_PER_FIELD = settings.max_files_per_field;
    }

    // 7.1) الإعلانات المفعَّلة حاليًا
    const { data: anns } = await SB.from('announcements').select('id, message, created_at').eq('is_active', true).order('created_at', {ascending:false});
    ACTIVE_ANNOUNCEMENTS = anns || [];

    // 7.2) تقرير المشارك المنشور (إن وُجد) — تحفيزي وتطويري، منفصل عن أي تقييم داخلي
    const { data: pubReport } = await SB.from('participant_reports').select('report, published_at').eq('form_id', FORM_ID).eq('is_published', true).order('generated_at',{ascending:false}).limit(1).maybeSingle();
    PUBLISHED_REPORT = pubReport || null;

    // حالة الاستيفاء مستقلة عن التقرير — تُحسَب وتُعرَض فورًا لو نُشرت صراحة
    // (حتى قبل جاهزية التقرير الكامل)، أو تلقائيًا لو التقرير نُشر أصلًا
    let qualificationPublished = false;
    try{
      const { data: settingsRow } = await SB.from('form_settings').select('qualification_status_published, judging_info_published').eq('id', 1).maybeSingle();
      qualificationPublished = !!(settingsRow && settingsRow.qualification_status_published);
      var judgingInfoPublished = !!(settingsRow && settingsRow.judging_info_published);
    } catch(e){ console.error('تعذّر جلب إعداد نشر الاستيفاء:', e); }

    if((qualificationPublished || PUBLISHED_REPORT) && form.status === 'submitted'){
      try{
        const { data: allHumanReqs } = await SB_AUTH.from('requirement_status').select('requirement, status').eq('form_id', FORM_ID);
        const humanReqMap = {}; (allHumanReqs||[]).forEach(r=>{ humanReqMap[r.requirement] = r.status; });
        const hasCommercial = humanReqMap['commercial_registration'] ? humanReqMap['commercial_registration'] === 'ok' : state.values['f2_1'] === 'نعم';
        let ipKey = null;
        for(const sec of SECTIONS){
          for(const q of sec.fields){
            if((q.label||'').includes('حماية للملكية الفكرية') || (q.label||'').includes('شراكة مع جهات حكومية')){ ipKey = q.id; break; }
          }
          if(ipKey) break;
        }
        const hasIp = ipKey ? state.values[ipKey] === 'نعم' : false;

        if(hasCommercial || hasIp){
          QUALIFICATION_BADGE = 'ok';
        } else {
          // "مرشّح للتأهل": حقّق بقية المتطلبات الخمسة كاملة رغم عدم وجود
          // سجل تجاري أو بديله — يُعامَل معاملة "متأهل" تمامًا بصفحة المشارك،
          // نفس منطق لوحة التحكم بالضبط
          const [{ data: members }, { data: files }] = await Promise.all([
            SB_AUTH.from('team_members').select('id').eq('form_id', FORM_ID),
            SB_AUTH.from('form_files').select('field_key').eq('form_id', FORM_ID).is('deleted_at', null),
          ]);
          const memberCount = (members||[]).length;
          const fileKeys = (files||[]).map(f=>f.field_key);
          const suggestOther = (key)=>{
            if(key==='camp_attendance') return state.values['f3_2']==='نعم' ? 'ok' : (state.values['f3_2']==='لا' ? 'no' : null);
            if(key==='team_size') return memberCount ? (memberCount>=2 ? 'ok' : 'no') : null;
            if(key==='prototype'){ const s=state.values['f5_1']; return s ? (['poc','prototype','mvp','market'].includes(s)?'ok':'no') : null; }
            if(key==='pitch_deck'){ const s=state.values['f6_1']; const hasFile=fileKeys.includes('f6_2'); if(!s) return null; return (s==='غير مكتمل'||s==='لم يبدأ'||!hasFile) ? 'no' : 'ok'; }
            if(key==='market_validation'){ const s=state.values['f7_1']; if(s==='تحقق مكتمل') return 'ok'; if(s==='تحقق جزئي'||s==='تحقق جارٍ') return 'mid'; if(s==='لم يبدأ التحقق') return 'no'; return null; }
            return null;
          };
          const otherReqKeys = ['camp_attendance','team_size','prototype','pitch_deck','market_validation'];
          const candidateWithoutReg = otherReqKeys.every(k=>{
            const effective = humanReqMap[k] ? humanReqMap[k] : suggestOther(k);
            return effective === 'ok';
          });
          QUALIFICATION_BADGE = candidateWithoutReg ? 'ok' : 'none';
        }
      } catch(e){ console.error('تعذّر حساب حالة الاستيفاء:', e); }

      // لو المشروع متأهل، نجلب إسناد اللجنة/الفترة (إن وُجد) ومعايير
      // التحكيم — تُعرَض بالخطاب الموجَّه للفرق المتأهلة
      if(QUALIFICATION_BADGE === 'ok' && judgingInfoPublished){
        try{
          const { data: activeRound } = await SB.from('judging_rounds').select('id').eq('is_active', true).maybeSingle();
          if(activeRound){
            const { data: assignment } = await SB.from('committee_assignments').select('committee_id, period_id, attendance_confirmed').eq('form_id', FORM_ID).eq('round_id', activeRound.id).maybeSingle();
            if(assignment){
              const [{data: committee}, {data: period}] = await Promise.all([
                assignment.committee_id ? SB.from('judging_committees').select('name').eq('id', assignment.committee_id).maybeSingle() : Promise.resolve({data:null}),
                assignment.period_id ? SB.from('judging_periods').select('name, start_time, end_time').eq('id', assignment.period_id).maybeSingle() : Promise.resolve({data:null}),
              ]);
              ASSIGNED_COMMITTEE_NAME = committee ? committee.name : null;
              ASSIGNED_PERIOD = period || null;
              ATTENDANCE_CONFIRMED = assignment.attendance_confirmed;
              const { data: pres } = await SB.from('judging_presentations').select('file_name, storage_path, uploaded_at').eq('form_id', FORM_ID).maybeSingle();
              JUDGING_PRESENTATION = pres || null;
              const { data: presSettings } = await SB.from('form_settings').select('presentation_deadline_at, attendance_confirm_deadline_at').eq('id', 1).maybeSingle();
              if(presSettings && presSettings.presentation_deadline_at){
                PRESENTATION_DEADLINE_AT = presSettings.presentation_deadline_at;
                PRESENTATION_DEADLINE_PASSED = new Date() > new Date(presSettings.presentation_deadline_at);
              }
              if(presSettings && presSettings.attendance_confirm_deadline_at){
                ATTENDANCE_CONFIRM_DEADLINE = presSettings.attendance_confirm_deadline_at;
              }
            }
            const { data: criteria } = await SB.from('judging_criteria').select('label, description, max_score').eq('round_id', activeRound.id).eq('is_active', true).order('order_index');
            JUDGING_CRITERIA_LIST = criteria || [];
          }
        } catch(e){ console.error('تعذّر جلب بيانات اللجنة/الفترة/المعايير:', e); }
      }
    }

    if(form.status === 'submitted'){
      showingThankYou = true;
    }
    FORM_STATUS = form.status;
  } catch(e){
    showToast('تعذّر تحميل بيانات النموذج: ' + (e.message || 'خطأ غير معروف'));
  }

  // إغلاق النموذج (يدوي أو بعد الموعد) — يمنع الوصول لأي مشروع لم يُرسِل بعد
  if(computeClosedState() && FORM_STATUS !== 'submitted'){
    renderClosedScreen();
    return;
  }

  if(SECTIONS.length === 0){
    document.getElementById('sectionCard').innerHTML = `
      <div style="text-align:center;padding:40px 20px">
        <div style="font-size:15px;font-weight:700;color:var(--navy-800);margin-bottom:8px">تعذّر تحميل النموذج</div>
        <div style="font-size:13px;color:var(--ink-600)">حدث خطأ أثناء تحميل الأسئلة من الخادم. يرجى تحديث الصفحة، وإن استمرت المشكلة تواصل مع فريق البرنامج.</div>
      </div>`;
    return;
  }
  if(!SECTIONS.find(s=>s.id===state.current)) state.current = SECTIONS[0].id;

  bindTopbarActions();
  renderAll();
  if(FORM_DEADLINE && !computeClosedState()) startCountdown();
  startCloseWatcher();
}

/* ---------------- أزرار الحفظ وتسجيل الخروج في الشريط العلوي ---------------- */
function bindTopbarActions(){
  const saveBtn = document.getElementById('btnTopSave');
  const logoutBtn = document.getElementById('btnLogout');
  const saveBtnHTML = icon('save',{size:13}) + ' حفظ';
  saveBtn.innerHTML = saveBtnHTML;
  logoutBtn.innerHTML = icon('log-out',{size:13}) + ' خروج';

  saveBtn.addEventListener('click', async ()=>{
    saveBtn.disabled = true;
    saveBtn.textContent = 'جارٍ الحفظ…';
    await saveDraft(true);
    saveBtn.disabled = false;
    saveBtn.innerHTML = saveBtnHTML;
  });

  logoutBtn.addEventListener('click', ()=>{
    openLogoutConfirm();
  });
}

/* تأكيد بسيط قبل تسجيل الخروج، مع خيار الحفظ أولًا لتفادي فقدان تعديلات غير محفوظة */
function openLogoutConfirm(){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(11,11,61,.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:26px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);">
      <h3 style="margin:0 0 6px;font-size:16px;color:var(--navy-800)">تسجيل الخروج</h3>
      <p style="margin:0 0 18px;font-size:12.5px;color:var(--ink-600)">سيتم حفظ آخر تعديلاتك تلقائيًا قبل الخروج. هل تريد المتابعة؟</p>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="btn btn-ghost" id="logoutCancelBtn">إلغاء</button>
        <button class="btn btn-primary" id="logoutConfirmBtn">حفظ وخروج</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('logoutCancelBtn').addEventListener('click', ()=> overlay.remove());
  document.getElementById('logoutConfirmBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('logoutConfirmBtn');
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    await saveDraft(false);
    sessionStorage.removeItem('ib5_session');
    window.location.href = 'login.html';
  });
}

initApp();
</script>
